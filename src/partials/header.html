<a class="skip-link" href="#main">{{t.common.skip}}</a>
<div class="scroll-progress" data-progress aria-hidden="true"></div>
<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="logo" href="{{url.home}}" aria-label="{{site.name}} — {{t.nav.home}}">
      <span class="logo__mark" aria-hidden="true">AD</span>
      <span class="logo__text">
        <span class="logo__name">{{site.name}}</span>
        <span class="logo__tag">{{site.brandTagline}}</span>
      </span>
    </a>

    <nav class="nav" id="site-nav" aria-label="{{t.nav.menu}}" data-nav>
      <ul class="nav__list">
        <li><a href="{{url.services}}"{{nav.services}}>{{t.nav.services}}</a></li>
        <li><a href="{{url.calculator}}"{{nav.calculator}}>{{t.nav.calculator}}</a></li>
        <li><a href="{{url.about}}"{{nav.about}}>{{t.nav.about}}</a></li>
        <li><a href="{{url.reviews}}"{{nav.reviews}}>{{t.nav.reviews}}</a></li>
        <li><a href="{{url.blog}}"{{nav.blog}}>{{t.nav.blog}}</a></li>
        <li><a href="{{url.contact}}"{{nav.contact}}>{{t.nav.contact}}</a></li>
      </ul>
      <div class="nav__footer">
        <a class="btn btn--primary btn--lg nav__cta" href="{{url.contact}}">{{t.common.bookLong}}</a>
        <a href="tel:{{site.phoneHref}}">{{site.phone}}</a>
        <a href="mailto:{{site.email}}">{{site.email}}</a>
      </div>
    </nav>

    <div class="site-header__actions">
      <div class="lang-switch" role="group" aria-label="{{t.nav.langLabel}}">{{langSwitch}}</div>
      <a class="btn btn--primary btn--sm header-cta" href="{{url.contact}}" data-magnetic>{{t.common.book}}</a>
      <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false"
              data-menu-toggle data-label-open="{{t.nav.menu}}" data-label-close="{{t.nav.close}}">
        <span class="sr-only" data-menu-label>{{t.nav.menu}}</span>
        <span class="menu-toggle__bar" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
